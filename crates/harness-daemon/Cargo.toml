[package]
name = "harness-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "harness-daemon"
path = "src/main.rs"

[[bin]]
name = "cowok-design"
path = "src/bin/cowok_design.rs"

[dependencies]
domain = { path = "../domain" }
spec-registry = { path = "../spec-registry" }
context-compiler = { path = "../context-compiler" }
constraint-engine = { path = "../constraint-engine" }
html-forge = { path = "../html-forge" }
presentation-cms = { path = "../presentation-cms" }
flow-graph = { path = "../flow-graph" }
plugin-host = { path = "../plugin-host" }
bot-fleet = { path = "../bot-fleet" }
mcp-gateway = { path = "../mcp-gateway" }
rea-bridge = { path = "../rea-bridge" }
axum = "0.7"
futures-util = { version = "0.3", default-features = false }
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "net", "process", "signal", "sync", "time"] }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
sha2.workspace = true
rusqlite.workspace = true
libc = "0.2"
base64 = "0.22"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
zeroize = "1.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio-cron-scheduler = "0.15"
croner = "3.0"
ts-rs = { workspace = true, optional = true }

[features]
default = []
ts = ["dep:ts-rs"]

[dev-dependencies]
tempfile.workspace = true
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

