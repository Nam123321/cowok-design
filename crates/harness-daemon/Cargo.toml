[package]
name = "harness-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "harness-daemon"
path = "src/main.rs"

[dependencies]
domain = { path = "../domain" }
spec-registry = { path = "../spec-registry" }
constraint-engine = { path = "../constraint-engine" }
flow-graph = { path = "../flow-graph" }
html-forge = { path = "../html-forge" }
presentation-cms = { path = "../presentation-cms" }
plugin-host = { path = "../plugin-host" }
rea-bridge = { path = "../rea-bridge" }
bot-fleet = { path = "../bot-fleet" }
mcp-gateway = { path = "../mcp-gateway" }
axum = "0.7"
futures-util = { version = "0.3", default-features = false }
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
sha2.workspace = true
rusqlite.workspace = true
libc = "0.2"
base64 = "0.22"

[dev-dependencies]
tempfile.workspace = true
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

