name: cowok-design CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# Least-Privilege IAM boundary (OWASP CI/CD Recommendation)
permissions: read-all

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # LANE 1: RUST CORE HARNESS (11 CRATES)
  # ==========================================
  rust-core:
    name: Rust Core Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Rust Cache
        uses: swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3 # v2.7.7
        with:
          shared-key: "cowok-design-rust"

      - name: Rust Format Check
        run: cargo fmt --all --check

      - name: Rust Clippy (Zero Warnings Allowed)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust Workspace Unit & Integration Tests
        run: cargo test --workspace --verbose

  # ==========================================
  # LANE 2: FRONTEND REACT 19 SPA & TYPES
  # ==========================================
  frontend-core:
    name: Frontend Typecheck & Vitest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: 9

      - name: Setup Node.js 20
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript Contract & App Typecheck
        run: pnpm run typecheck

      - name: Vitest Unit Tests
        run: pnpm run test

      - name: Vite Production Build Verification
        run: pnpm run build

  # ==========================================
  # MASTER GATE: BRANCH PROTECTION ANCHOR
  # ==========================================
  ci-master-gate:
    name: ci-master-gate
    needs: [rust-core, frontend-core]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Evaluate Upstream Lanes
        run: |
          if [ "${{ needs.rust-core.result }}" != "success" ] || \
             [ "${{ needs.frontend-core.result }}" != "success" ]; then
            echo "❌ Upstream verification failed."
            echo "rust-core: ${{ needs.rust-core.result }}"
            echo "frontend-core: ${{ needs.frontend-core.result }}"
            exit 1
          fi
          echo "✅ All CI gates verified successfully."
