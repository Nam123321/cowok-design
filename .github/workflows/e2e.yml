name: cowok-design E2E Playwright

on:
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions: read-all

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-browser:
    name: Playwright E2E Headless Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: 9

      - name: Setup Node.js 22
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Rust Cache
        uses: swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3 # v2.7.7
        with:
          workspaces: "."

      - name: Build Rust Backend Daemon
        run: cargo build --bin harness-daemon

      - name: Start Rust Backend Daemon & Wait for Health
        env:
          UXUI_OS_DAEMON_PORT: "4170"
        run: |
          ./target/debug/harness-daemon >/tmp/harness-daemon-e2e.log 2>&1 &
          DAEMON_PID=$!
          for i in $(seq 1 30); do
            if ! kill -0 "$DAEMON_PID" 2>/dev/null; then
              echo "❌ harness-daemon exited prematurely."
              cat /tmp/harness-daemon-e2e.log || true
              exit 1
            fi
            if curl -fsS "http://127.0.0.1:${UXUI_OS_DAEMON_PORT}/api/v1/health" >/dev/null 2>&1; then
              echo "✅ harness-daemon healthy on port ${UXUI_OS_DAEMON_PORT} (attempt ${i}/30)."
              exit 0
            fi
            sleep 0.5
          done
          echo "❌ harness-daemon health check timed out after 15s."
          cat /tmp/harness-daemon-e2e.log || true
          exit 1

      - name: Build Production Frontend
        run: pnpm run build

      - name: Run Playwright E2E Tests (Focus-Free Headless)
        run: pnpm exec playwright test --config=playwright.ui.config.ts
        env:
          CI: true

      - name: Upload E2E Evidence Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
