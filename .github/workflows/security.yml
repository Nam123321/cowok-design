name: cowok-design Security & SCA Ratchet

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    # Weekly Sunday midnight scan for newly discovered CVEs
    - cron: '0 0 * * 0'

permissions: read-all

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # LANE 1: PNPM AUDIT RATCHET (ZERO NEW CVES)
  # ==========================================
  audit-ratchet:
    name: Pnpm Dependency Ratchet (SCA)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: 9

      - name: Setup Node.js 22
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22

      - name: Run CI Audit Ratchet
        run: node scripts/ci-audit-ratchet.js

  # ==========================================
  # LANE 2: SEMGREP SAST SCAN
  # ==========================================
  semgrep-sast:
    name: Semgrep SAST Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Semgrep SAST
        run: |
          python3 -m pip install semgrep
          semgrep scan --config auto --severity ERROR --error

  # ==========================================
  # LANE 3: GITLEAKS SECRET DETECTION
  # ==========================================
  gitleaks:
    name: Gitleaks Secret Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@f586c14365d4643c6aa59d472ae6e984bf47bb34 # v2.3.8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================
  # LANE 4: CARGO DENY (RUST SUPPLY CHAIN)
  # ==========================================
  cargo-deny:
    name: Cargo Deny (License & Advisories)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Cargo Deny Check
        uses: embarkstudios/cargo-deny-action@34899fc7ba81ca6268d5947a7a16b4649013fea1 # v2.0.11
        with:
          command: check
          arguments: --workspace
