name: 4-Channel Distribution Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions: read-all

jobs:
  # ==========================================
  # CHANNEL 1: CROSS-PLATFORM SINGLE-BINARY CLI
  # ==========================================
  release-cli:
    name: Build Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: cowok-design-linux-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: cowok-design-macos-arm64
          - os: macos-13
            target: x86_64-apple-darwin
            artifact_name: cowok-design-macos-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: cowok-design-windows-x64.exe

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3 # v2.7.7

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage Binary Artifact
        shell: bash
        run: |
          mkdir -p dist-bin
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/harness-daemon.exe" "dist-bin/${{ matrix.artifact_name }}" || cp "target/${{ matrix.target }}/release/*.exe" "dist-bin/${{ matrix.artifact_name }}" || true
          else
            cp "target/${{ matrix.target }}/release/harness-daemon" "dist-bin/${{ matrix.artifact_name }}" || cp "target/${{ matrix.target }}/release/cowok*" "dist-bin/${{ matrix.artifact_name }}" || true
            chmod +x "dist-bin/${{ matrix.artifact_name }}" || true
          fi

      - name: Upload Binary to Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          files: dist-bin/*

  # ==========================================
  # CHANNEL 4: DOCKER OCI CONTAINER IMAGE (GHCR)
  # ==========================================
  release-docker:
    name: Build & Push OCI Container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ghcr.io/${{ github.repository }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
