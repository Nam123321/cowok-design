name: 🤖 PR Babysitter

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions: read-all

concurrency:
  group: pr-babysitter-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  babysit:
    name: Auto-Triage & Self-Healing
    runs-on: ubuntu-latest
    # CHỐNG LẶP VÔ TẬN: Tuyệt đối không chạy nếu commit cuối cùng do chính Bot tạo ra
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: 🛡️ Privilege & Fork Isolation Gate
        id: fork-check
        run: |
          IS_FORK="${{ github.event.pull_request.head.repo.full_name != github.repository }}"
          echo "is_fork=$IS_FORK" >> $GITHUB_OUTPUT
          if [ "$IS_FORK" = "true" ]; then
            echo "⚠️ PR xuất phát từ Fork bên ngoài. Chuyển sang chế độ READ-ONLY (Chống PwnRequest)."
          fi

      - name: 📥 Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: ⚙️ Setup Node.js & Tooling
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '20'

      - name: 🤖 Execute PR Babysitter Runner (3-Strike Circuit Breaker)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IS_FORK: ${{ steps.fork-check.outputs.is_fork }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CI: "true"
        run: |
          node scripts/pr-babysitter-runner.js
