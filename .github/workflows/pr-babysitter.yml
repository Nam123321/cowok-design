name: 🤖 PR Babysitter

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions: read-all

concurrency:
  group: pr-babysitter-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  babysit:
    name: Auto-Triage & Self-Healing
    runs-on: ubuntu-latest
    # CHỐNG LẶP VÔ TẬN: Tuyệt đối không chạy nếu commit cuối cùng do chính Bot tạo ra
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: 🛡️ Privilege & Fork Isolation Gate
        id: fork-check
        run: |
          IS_FORK="${{ github.event.pull_request.head.repo.full_name != github.repository }}"
          echo "is_fork=$IS_FORK" >> $GITHUB_OUTPUT
          if [ "$IS_FORK" = "true" ]; then
            echo "⚠️ PR xuất phát từ Fork bên ngoài. Chuyển sang chế độ READ-ONLY (Chống PwnRequest)."
          fi

      - name: 📥 Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: ⚙️ Setup Node.js & Tooling
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '22'

      - name: 🦀 Setup Rust Formatter (rustfmt)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt

      - name: 🤖 Execute PR Babysitter Triage (Default Read-Only; 3-Strike Circuit Breaker)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          IS_FORK: ${{ steps.fork-check.outputs.is_fork }}
          IS_DRAFT: ${{ github.event.pull_request.draft || false }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BABYSITTER_AUTO_PUSH: ${{ vars.BABYSITTER_AUTO_PUSH || 'false' }}
          CI: "true"
        run: node scripts/pr-babysitter-runner.js
