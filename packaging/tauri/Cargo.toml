# Isolated Tauri v2 Desktop Host Crate — intentionally excluded from root Cargo.toml
# [workspace].members so headless Linux/macOS CI Rust runners can run
# `cargo check --workspace` and `cargo test --workspace` without GTK/WebKit2GTK OS packages.
[package]
name = "cowok-design-desktop"
version = "1.0.0-rc.1"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Tauri v2 Desktop Host packaging the cowok-design sidecar with HMAC capability isolation and Ed25519 updater verification."

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
harness-daemon = { path = "../../crates/harness-daemon" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
